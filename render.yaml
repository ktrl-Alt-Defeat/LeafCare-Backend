# Render blueprint for the LeafCare backend.
#
# Apply with: Render Dashboard -> New -> Blueprint, pointed at this repo.
#
# Secrets are declared with `sync: false`, which means Render prompts for them
# on first deploy and stores them encrypted. They are deliberately NOT written
# here — this file is committed.

services:
  - type: web
    name: leafcare-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore # Closest region to the users this serves.
    branch: main

    # Returns 503 when PostgreSQL is unreachable, so a broken deploy is caught
    # here rather than being rolled out and serving errors.
    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production

      # Render injects PORT and expects the service to bind it.
      - key: PORT
        value: 5000

      - key: APP_VERSION
        value: 1.0.0

      - key: LOG_LEVEL
        value: info

      # One proxy hop (Render's load balancer). Without this, rate limiting sees
      # every request as coming from the proxy and buckets all users together.
      - key: TRUST_PROXY
        value: 1

      # Comma-separated. Must list the deployed frontend origin, otherwise the
      # browser blocks every call.
      - key: CORS_ORIGIN
        sync: false

      # Supabase pooled connection (port 6543) for the app; direct connection
      # (5432) for migrations.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # --- Inference host ----------------------------------------------------
      # Both vision models in one FastAPI process on a GPU workstation, reached
      # over a tunnel. Set this to the tunnel's public HTTPS URL, with no
      # trailing slash and no path.
      #
      # Unset, the API still serves everything else: /ai/health reports
      # `not_configured` and a scan returns no diagnosis rather than failing.
      - key: INFERENCE_SERVICE_URL
        sync: false

      # Must equal API_KEY on the inference host. The host answers 401 without
      # it, and the backend logs that as a misconfiguration rather than as
      # another flaky-tunnel warning.
      - key: INFERENCE_API_KEY
        sync: false

      - key: INFERENCE_TIMEOUT_MS
        value: "45000"
      # Tighter: the live viewfinder polls detection, and a frame the user has
      # already moved past is worthless.
      - key: INFERENCE_DETECT_TIMEOUT_MS
        value: "20000"
      # Generous: the farmer is watching a progress animation, and the first
      # request after the workstation wakes pays for weight residency.
      - key: INFERENCE_CLASSIFY_TIMEOUT_MS
        value: "60000"
      - key: INFERENCE_HEALTH_TIMEOUT_MS
        value: "8000"

      # --- Leaf detector request parameters ----------------------------------
      # Knobs sent with each detection request. Detection is advisory: finding
      # no leaf means the full frame is classified, never that the scan stops.
      - key: YOLO_MIN_CONFIDENCE
        value: "0.35"
      - key: YOLO_IMAGE_SIZE
        value: "640"

      # --- Rate limiting -----------------------------------------------------
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_GENERAL_MAX
        value: "100"
      - key: RATE_LIMIT_AUTH_MAX
        value: "20"
      - key: RATE_LIMIT_AI_MAX
        value: "10"
      - key: RATE_LIMIT_UPLOAD_MAX
        value: "5"
      # The viewfinder detector is polled several times a second while a farmer
      # frames a leaf; the AI ceiling would cut guidance off after seven
      # seconds of aiming.
      - key: RATE_LIMIT_VISION_MAX
        value: "300"

      # --- Optional ----------------------------------------------------------
      # Guards the admin and seller write endpoints. Unset, they fail closed.
      - key: LEAFCARE_ADMIN_KEY
        sync: false
      # Unset, the voice endpoints answer 503 and nothing else is affected.
      - key: ELEVEN_LABS_API_KEY
        sync: false
